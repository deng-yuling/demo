<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2048 小游戏</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(160deg, #fff5f7, #e8f4ff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #5c4a52;
    }
    .wrap {
      max-width: 420px;
      width: 100%;
      background: #fff;
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 12px 40px rgba(200, 120, 140, 0.2);
      text-align: center;
    }
    h1 { font-size: 1.6rem; margin-bottom: 8px; color: #e86b8f; }
    p { font-size: 0.9rem; color: #8a7279; margin-bottom: 24px; line-height: 1.5; }
    a.card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: #fff5f7;
      border: 2px solid #ffd4e0;
      border-radius: 14px;
      padding: 18px 16px;
      margin-bottom: 12px;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    a.card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 143, 171, 0.25);
    }
    a.card strong { display: block; font-size: 1.1rem; margin-bottom: 4px; }
    a.card span { font-size: 0.82rem; color: #8a7279; }
    .emoji { font-size: 1.8rem; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>2048 小游戏</h1>
    <p>选一个版本开始玩，无需安装，打开链接即可。</p>
    <a class="card" href="xueli-2048/">
      <div class="emoji">🍐</div>
      <strong>雪梨 2048</strong>
      <span>含历史分数排名 · 推荐</span>
    </a>
    <a class="card" href="game-2048/">
      <div class="emoji">🐣</div>
      <strong>萌萌 2048</strong>
      <span>简约初版</span>
    </a>
  </div>
</body>
</html>
