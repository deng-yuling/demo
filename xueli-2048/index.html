<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>雪梨 2048</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="title-block">
        <h1 class="title">
          <span class="title-emoji">🍐</span>
          雪梨 2048
        </h1>
        <p class="subtitle">合并相同数字，冲向 2048！</p>
      </div>
      <div class="scores">
        <div class="score-box">
          <span class="score-label">得分</span>
          <span id="score" class="score-value">0</span>
        </div>
        <div class="score-box best">
          <span class="score-label">最高</span>
          <span id="best-score" class="score-value">0</span>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="board-wrap">
        <div id="board" class="board" aria-label="2048 游戏棋盘"></div>
        <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true">
          <div class="overlay-card">
            <p id="overlay-emoji" class="overlay-emoji">🎉</p>
            <h2 id="overlay-title" class="overlay-title">太棒啦！</h2>
            <p id="overlay-msg" class="overlay-msg">你合成了 2048！</p>
            <div class="overlay-actions">
              <button id="btn-continue" class="btn btn-secondary hidden">继续玩</button>
              <button id="btn-retry" class="btn btn-primary">再来一局</button>
            </div>
          </div>
        </div>
      </div>

      <div class="controls">
        <button id="btn-new" class="btn btn-primary btn-wide">
          <span>✨</span> 新游戏
        </button>
        <button id="btn-history" class="btn btn-outline btn-wide" type="button">
          <span>📊</span> 历史分数排名
        </button>
        <p class="hint">方向键 / WASD 移动 · 手机可滑动</p>
      </div>
    </main>

    <footer class="footer">
      <span>雪梨 2048 · 祝你好运 🍀</span>
    </footer>
  </div>

  <div id="history-modal" class="history-modal hidden" role="dialog" aria-modal="true" aria-labelledby="history-title">
    <div class="history-backdrop" id="history-backdrop"></div>
    <div class="history-panel">
      <div class="history-header">
        <h2 id="history-title" class="history-title">🍐 历史分数排名</h2>
        <button id="btn-history-close" class="btn-close" type="button" aria-label="关闭">×</button>
      </div>
      <p class="history-desc">按分数从高到低排列 · 共 <span id="history-count">0</span> 局</p>
      <div class="history-list-wrap">
        <ul id="history-list" class="history-list"></ul>
        <p id="history-empty" class="history-empty hidden">还没有对局记录，快去玩一局吧～</p>
      </div>
    </div>
  </div>

  <script src="game-core.js"></script>
  <script src="game-history.js"></script>
  <script src="game.js"></script>
</body>
</html>
